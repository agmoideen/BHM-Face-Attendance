<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ഫേസ് അറ്റൻഡൻസ് സിസ്റ്റം</title>
    <!-- Tailwind CSS ഫോർ ഡിസൈൻ -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- face-api.js ലൈബ്രറി -->
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@latest/dist/face-api.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-4">

    <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-6 text-center">
        <h1 class="text-2xl font-bold text-blue-600 mb-4">സ്കൂൾ ഫേസ് അറ്റൻഡൻസ്</h1>
        
        <!-- ക്യാമറ സ്ക്രീൻ -->
        <div class="relative w-full h-80 bg-black rounded-lg overflow-hidden flex justify-center items-center mb-4">
            <video id="video" autoplay muted playsinline class="absolute w-full h-full object-cover"></video>
            <canvas id="overlay" class="absolute w-full h-full"></canvas>
        </div>

        <div id="status" class="text-lg font-semibold text-gray-700 mb-2">സിസ്റ്റം ലോഡ് ചെയ്യുന്നു... കാത്തിരിക്കുക.</div>
        
        <!-- അറ്റൻഡൻസ് ലിസ്റ്റ് കാണിക്കാൻ -->
        <div class="mt-4 text-left">
            <h2 class="font-bold text-gray-800 border-b pb-1 mb-2">ഇന്നത്തെ ഹാജർ പട്ടിക:</h2>
            <ul id="attendance-list" class="max-h-40 overflow-y-auto text-sm text-gray-600 space-y-1">
                <!-- ഹാജരായവരുടെ പേര് ഇവിടെ കാണിക്കും -->
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
